- rule: Ads and Sponsors (Global)
  feed: .*
  match: title
  regex: \b(ad|advertisement|sponsor|sponsored)\b

- rule: Deals (Global)
  feed: .*
  match: title
  regex: \b(deals?|promotions?)\b

- rule: Lawsuits and Legal Stuff (Global)
  feed: .*
  match: title
  regex: \b(lawsuits?|lawyers?)\b

- rule: Podcasts (Global)
  feed: .*
  match: title
  regex: \b(podcasts?)\b

- rule: US Mobile Carriers (Global)
  feed: .*
  match: title
  regex: \b(t-mobile?|at\&t?|verizon)\b

- rule: Fortnite (Global)
  feed: .*
  match: title
  regex: \b(fortnite?)\b
